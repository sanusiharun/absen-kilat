name: SDD foundation
on:
  pull_request:
  push:
    branches: [main, 'reengineering/**']
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_sdd.py
      - run: python -m unittest discover -s tools/tests -v
