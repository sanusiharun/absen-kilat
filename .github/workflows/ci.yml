name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Sebagian rilis Node 22/24/25 punya regresi npm yang membuat `npm ci`
          # gagal dengan "Exit handler never called!" (npm/cli#7657, #7666,
          # #8974). Versi ini yang terbukti jalan di mesin dev.
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      # Pakai npm yang sama dengan mesin dev: bug "Exit handler never called!"
      # berasal dari npm/Node yang dibundel image runner, bukan dari dependency.
      - run: npm i -g npm@10.9.8
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
