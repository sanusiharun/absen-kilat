name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    # npm di runner hosted gagal dengan 'Exit handler never called!' bahkan di
    # Node 20 (bahkan `npm cache clean --force` pun crash), jadi langkah ini
    # dijalankan di image node resmi yang isinya sama dengan mesin dev:
    # Node 22.23.1 + npm 10.9.8, tempat `npm ci` terbukti bersih.
    container: node:22.23.1-bookworm
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - name: versions
        run: node -v && npm -v
      - name: install (npm ci)
        run: npm ci --no-audit --no-fund
      - name: npm diagnostics on failure
        if: failure()
        run: |
          LOG=$(ls -S "$(npm config get cache)/_logs"/*-debug-0.log 2>/dev/null | head -1)
          echo "debug-log=$LOG"
          tail -n 250 "$LOG" 2>/dev/null || true
          df -h . ; free -m
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
