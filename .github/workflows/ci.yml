name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Versi yang sama dengan mesin dev (npm ci lokal exit 0).
          node-version: "22.23.1"
      # `npm ci` di runner gagal 'Exit handler never called!' setelah ~70 detik
      # padahal lokal bersih. Cache npm dari actions/setup-node dicurigai
      # membawa tarball rusak, jadi cache dimatikan dan cache lokal dibersihkan.
      - name: install (npm ci)
        run: |
          # npm 10.9.x termasuk versi yang kena bug 'Exit handler never called!'
          # di runner (npm/cli#7666); 10.8.1 dipakai sebagai pembanding.
          npm i -g npm@10.8.1
          npm cache clean --force
          npm ci --no-audit --no-fund --foreground-scripts
      # Diagnosis otomatis kalau install gagal: versi runtime, log debug npm
      # (baris di atas 'Exit handler never called' biasanya menyebut penyebab
      # sebenarnya), plus disk/RAM runner.
      - name: npm diagnostics on failure
        if: failure()
        run: |
          echo "node=$(node -v) npm=$(npm -v) registry=$(npm config get registry)"
          # ambil log TERBESAR (log npm ci), bukan log 'npm config get' yang kecil
          LOG=$(ls -S /home/runner/.npm/_logs/*-debug-0.log 2>/dev/null | head -1)
          echo "debug-log=$LOG ($(wc -l < "$LOG" 2>/dev/null) baris)"
          tail -n 250 "$LOG" 2>/dev/null || true
          df -h . ; free -m
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
