name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      # package-lock.json menyimpan URL tarball. Kalau lockfile dibuat di mesin
      # yang memakai mirror npm internal, URL-nya tidak bisa dijangkau runner CI
      # dan `npm ci` mati dengan pesan menyesatkan "Exit handler never called!".
      # Jaga supaya lockfile tetap menunjuk registry publik.
      - name: guard package-lock registry
        run: |
          if grep -qE 'mirrors?\.|tencentyun|npmmirror' package-lock.json; then
            echo "::error file=admin/package-lock.json::Lockfile memuat URL registry internal (tidak terjangkau runner CI). Jalankan: npm install --registry=https://registry.npmjs.org/"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
