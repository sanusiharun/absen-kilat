name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      # --no-audit --no-fund: tanpa ini `npm ci` di runner sempat gagal dengan
      # "npm error Exit handler never called!" (bug internal npm pada langkah
      # audit/funding, bukan masalah dependency).
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
